# coturn — STUN/TURN for the live classroom (self-hosted).
# The secret, realm, public IP and certificate paths are passed on the command
# line from docker-compose.yml (.env), so this file contains no credentials.
# Note: coturn does not allow comments at the end of a setting line.

# STUN + TURN over UDP and TCP
listening-port=3478
# TURN over TLS (turns:) for networks that only allow TLS.
# To reach users behind very strict firewalls, TURN/TLS can also run on 443
# with a second public IP — see README.md "TURN on port 443".
tls-listening-port=5349

# Relay ports (kept apart from LiveKit's 50000-60000).
min-port=49152
max-port=49999

# Time-limited credentials: Laravel signs "expiry:identity" with the shared
# secret (TURN REST API). Nothing is stored in a user database.
use-auth-secret
fingerprint

# Security (TLS 1.0/1.1 are disabled by default in current coturn)
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600
user-quota=12
total-quota=1200
# Never relay into private / loopback networks (prevents SSRF through TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
